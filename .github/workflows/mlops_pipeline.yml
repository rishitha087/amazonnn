name: Amazon Bestseller MLOps Pipeline Automation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  run-src-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Automated src/ Pipeline
      run: |
        python -m src.run_all

    - name: Run Test Suite
      run: |
        pytest tests/ -v

    - name: Upload Pipeline Artifacts & Reports
      uses: actions/upload-artifact@v4
      with:
        name: mlops-artifacts
        path: |
          artifacts/
          outputs/
