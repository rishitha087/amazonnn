name: Amazon MLOps Pipeline Failure Handling & Self-Healing Suite

on:
  schedule:
    - cron: '0 2 * * 1' # Weekly Monday at 2am
  workflow_dispatch:

jobs:
  resilience-testing:
    name: Run Failure Injection & Auto-Recovery
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Failure Injection Suite (15 runs across 5 scenarios)
      run: |
        python src/mlops_pipeline/10_failure_injection.py

    - name: Upload Resilience Audit Report
      uses: actions/upload-artifact@v3
      with:
        name: failure-resilience-report
        path: reports/failure_report.json

