name: Amazon MLOps End-to-End CI/CD Pipeline

on:
  push:
    branches: [ main, develop, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  mlops-pipeline-validation:
    name: Run MLOps Test Suite & Orchestration
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run Core Pipeline & Model Tests
      run: |
        pytest tests/test_pipeline.py -v

    - name: Run FastAPI Serving & Performance Tests
      run: |
        pytest tests/test_api.py tests/test_performance.py -v

    - name: Execute End-to-End MLOps Pipeline
      run: |
        python src/mlops_pipeline/amazon_genre_pipeline.py --force

    - name: Archive Pipeline Artifacts & Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: amazon-mlops-reports-py${{ matrix.python-version }}
        path: |
          reports/
          artifacts/
          outputs/
