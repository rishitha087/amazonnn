apiVersion: apps/v1
kind: Deployment
metadata:
  name: amazon-genre-api-deployment
  labels:
    app: amazon-genre-api
    tier: serving
spec:
  replicas: 2
  selector:
    matchLabels:
      app: amazon-genre-api
  template:
    metadata:
      labels:
        app: amazon-genre-api
    spec:
      containers:
      - name: amazon-genre-api
        image: amazon-genre-api:v1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 2

